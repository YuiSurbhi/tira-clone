<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Tira Clone</title>
  </head>
  <body>
    <header>
      <div class="utility-bar">
        <p>Track Order | Help Center</p>
      </div>
      <div class="main-bar">
        <div class="main-bar-left">
          <div class="logo">
            <a href="/"><h1>tira</h1></a>
            <p>Welcome<br/> Login/Sign Up <i class="ri-arrow-right-s-line"></i></p>
          </div>
          <div class="nav-link">
            <nav>
              <a href="#brands">Brands</a>
              <a href="#tira-red">Tira Red</a>
              <a href="#offers">Offers</a>
              <a href="#top-shelf">Top Shelf</a>
              <a href="#for-you">For You</a>
            </nav>
          </div>
        </div>
        <div class="main-bar-right">
          <div class="search">
            <form action="/search" method="get">
              <input id="item-search" type="search" name="search" placeholder="Search">
              <button type="submit"><i class="ri-search-line"></i></button>
            </form>
          </div>
          <div class="icons">
            <a href="#cart" aria-label="Cart"><i class="ri-shopping-bag-line"></i></a>
            <a href="#account" aria-label="Account"><i class="ri-user-3-line"></i></a>
          </div>
        </div>
      </div>
      <div class="category-bar">
        <div class="links">
          <nav>
            <a href="#what's-new">What's New</a>
            <a href="#makeups">Makeups</a>
            <a href="#skin">Skin</a>
            <a href="#hair">Hair</a>
            <a href="#fragrance">Fragrance</a>
            <a href="#men">Men</a>
            <a href="#bath&amp;body">Bath & Body</a>
            <a href="#tools&amp;alppiances">Tools & Appliances</a>
            <a href="#mom&amp;baby">Mom & Baby</a>
            <a href="#wellness">Wellness</a>
            <a href="#minis">Minis</a>
            <a href="#homegrows">Homegrows</a>
            <a href="#gifts">Gifts</a>
        </nav>
        </div>
      </div>
    </header>
  </body>
</html>
